name: Smoke test latest APK

# Installs the latest released APK in an emulator, opens it twice (the second
# launch is when a downloaded over-the-air update takes over), and saves
# screenshots plus logs. Use it after publishing in Base44 to confirm updates land.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern RetroVision.apk --clobber

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-test.sh RetroVision.apk smoke

      # Saves screenshots + logs on the smoke-results branch (easy to view on GitHub)
      # and puts the key log lines on the run summary.
      - name: Publish smoke-test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-smoke-results.sh smoke "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          retention-days: 14
